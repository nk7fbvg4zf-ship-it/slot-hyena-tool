<style>
:root{--bg:#090b10;--card:#141924;--line:#293245;--txt:#f4f7fb;--muted:#98a5b9;--p:#7459ff;--green:#44dfa0;--yellow:#ffe070;--orange:#ffb067;--red:#ff8d92}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{position:sticky;top:0;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 14px 11px;background:#090b10ee;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}.ver{font-size:11px;padding:4px 7px;border:1px solid #344056;border-radius:99px;color:#c3ccda}

main{max-width:760px;margin:auto;padding:12px 13px 92px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}button{font-family:inherit}.nav button,.btn{padding:10px;border-radius:12px;border:1px solid var(--line);background:#111722;color:white;font-weight:800}.nav .on{background:var(--p);border-color:var(--p)}
.card{background:linear-gradient(180deg,#171d29,#121722);border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0}.name{font-size:16px;font-weight:900;padding-right:36px}.sub,.note{font-size:12px;color:var(--muted);line-height:1.5}.fav{float:right;border:0;background:none;color:#ffd65e;font-size:24px}
.pill{display:inline-block;margin:8px 5px 0 0;padding:4px 8px;border-radius:99px;background:#242c3d;font-size:11px}.back{border:0;background:none;color:#b9aaff;font-size:16px;padding:5px 0 10px}

function v5tag(t){
 if(t==="pub")return '<span class=tagPub>解析・公表</span>';
 if(t==="data")return '<span class=tagData>実戦データ/有力</span>';
 if(t==="theory")return '<span class=tagTheory>考察/未確定</span>';
 return '<span class=tagPending>未解析</span>';
}
function targetText(m){
 if(!m.targets)return "狙い目データ未収録";
 const t=m.targets;
 function fmt(x){
  if(!x)return "";
  return Object.entries(x).map(([k,v])=>`${k}:${v}G`).join(" / ");
 }
 let a=[];
 if(t.equal)a.push("等価 "+fmt(t.equal));
 if(t.held)a.push("持ちメダル "+fmt(t.held));
 if(t.cash)a.push("現金 "+fmt(t.cash));
 return a.join("<br>")||"狙い目データ未収録";
}
function evText(m){
 if(!m.ev)return "公開期待値表は未収録";
 let ks=Object.keys(m.ev);
 return ks.length?`公開期待値テーブルあり：${ks.join(" / ")}`:"公開期待値表は未収録";
}
function fieldText(m){
 if(!m.fields||!m.fields.length)return "入力項目なし";
 return m.fields.map(f=>f.label).join(" / ");
}

 if(!m.ev)return null;
 if(m.name==="L 東京喰種"){
   let a=nearest(m.ev.at,+val.at),c=nearest(m.ev.cz,+val.cz),arr=[a,c].filter(Boolean);
   if(!arr.length)return null; return Math.max(...arr.map(x=>x[1]));
 }
 if(m.name.includes("かぐや")){
   let key=val.reset==="あり"?"reset":val.prev, e=nearest(m.ev[key],+val.g);return e?e[1]:null;
 }
 let e=nearest(m.ev.g,+val.g);return e?e[1]:null;
}
function adjustedEv(m,val,j){
 let b=baseEv(m,val);
 if(b!==null){
   if(mode()==="equal") return {text:`約 ${b>=0?"+":""}${b.toLocaleString()}円`,kind:"公開EV",conf:m.confidence};
   return {text:`等価公開値 ${b>=0?"+":""}${b.toLocaleString()}円`,kind:"非等価の正確な金額は未算出",conf:m.confidence};
 }
 let range;
 if(j.score<=0) range="マイナス域の可能性";
 else if(j.score==1) range="条件次第";
 else if(j.score==2) range="プラス域候補";
 else if(j.score==3) range="+1,000円前後以上を狙う位置";
 else if(j.score==4) range="強めの期待値候補";
 else range="最優先クラス";
 return {text:range,kind:"狙い目基準からの目安",conf:m.confidence||"C"};
}
function judge(m,x){
 const t=m.targets?.[mode()]||m.targets?.cash||{};let s=0,r=[];
 const up=(n,txt)=>{s=Math.max(s,n);if(txt)r.push(txt)};
 if(m.zoneOnly){
   let g=+x.g;
   if((g>=280&&g<=330)||(g>=570&&g<=620))up(3,"強ゾーン付近");
   else if((g>=130&&g<=170)||(g>=430&&g<=470)||(g>=730&&g<=770))up(2,"チャンスゾーン付近");
 }
 else if(m.name==="L 東京喰種"||m.name==="攻殻機動隊 S.A.C."){if(+x.at>=t.at)up(3,"AT間");if(+x.cz>=t.cz)up(3,"CZ間");if(x.reset==="あり"&&t.reset&&+x.cz>=t.reset)up(3,"リセット");if(+x.at>=t.at+150||+x.cz>=t.cz+100)up(4,"天井接近")}
 else if(m.name.includes("かぐや")){let th=x.reset==="あり"?t.reset:t[x.prev];if(+x.g>=th)up(3,"基準クリア");if(+x.g>=th+100)up(4,"深め");if(+x.czmiss>=4)up(5,"CZ4スルー以上")}
 else if(m.name==="スマスロ モンキーターンV"||m.name==="L戦国コレクション6"||m.name==="スマスロ 新鬼武者3"){let g=x.reset==="あり"?t.resetg:t.g,c=x.reset==="あり"?t.resetcycle:t.cycle;if(+x.g>=g)up(3,"G数");if(+x.cycle>=c)up(3,"周期");if(+x.g>=g+150||+x.cycle>=c+1)up(4,"深め/周期進行")}
 else if(m.name.includes("からくりサーカス2")){if(+x.czg>=t.czg)up(3,"CZ間");if(+x.atg>=t.atg)up(3,"AT間");if(+x.czmiss>=4)up(5,"CZ4スルー")}
 else if(m.name.includes("東京リベンジャーズ")||m.name.includes("バイオハザードRE:3")||m.name.includes("ストリートファイター6")){let th=(x.reset==="あり"&&t.reset)?t.reset:t.g;if(+x.g>=th)up(3,"G数");if(+x.miss>=3)up(3,"スルー");if(+x.miss>=5)up(5,"スルー天井接近");if(+x.pt>=400)up(3,"ポイント")}
 else if(m.name.includes("やじきた")){if(+x.g>=t.g)up(3,"マイル");if(+x.miss>=4)up(3,"CZスルー");if(+x.miss>=6)up(5,"CZ天井直前")}
 else if(m.name.includes("沖")){if(+x.g>=t.g)up(2,"G数");if(+x.miss>=3)up(3,"スルー");if(x.state&&x.state!=="不明"&&!x.state.includes("通常"))up(3,"モード/区間示唆");if(+x.miss>=5)up(4,"多スルー")}
 else if(m.name.includes("転生の章2")){if(+x.g>=t.g)up(3,"G数");if(+x.pt>=1000)up(3,"あべし");if(+x.pt>=1300)up(4,"天井接近")}
 else if(m.name.includes("海門決戦")){let th=x.reset==="あり"?t.reset:t.g;if(+x.g>=th)up(3,x.reset==="あり"?"リセット短縮":"G数");if(+x.g>=th+120)up(4,"深め")}
 else if(m.name.includes("青春ブタ野郎")){let th=x.short==="あり"?t.shortg:t.g;if(+x.g>=th)up(3,x.short==="あり"?"短縮天井":"G数");if(+x.czmiss>=5)up(4,"CZ5スルー");if(+x.czmiss>=6)up(5,"次回CZで天井")}
 else if(m.name.includes("モグモグ風林火山")){let reset=x.reset==="あり";if((reset&&+x.g>=200)||(!reset&&+x.g>=t.g))up(3,"CZ間");if((reset&&+x.miss>=3)||(!reset&&+x.miss>=6))up(4,"CZスルー");if((reset&&+x.cycle>=2)||(!reset&&+x.cycle>=5))up(4,"周期天井接近")}
 else if(m.name.includes("とある魔術の禁書目録2")){if(+x.at>=t.at)up(3,"AT間");if(+x.cz>=t.cz)up(3,"CZ間")}
 else {if(+x.g>=t.g)up(3,"基準クリア");if(+x.g>=t.g+150)up(4,"深め");if(x.short==="あり")up(3,"短縮示唆")}
 let lab=["× 見送り","△ 条件次第","○ 打てる","◎ かなりあり","🔥 強い","🔥🔥 最優先"][Math.min(s,5)];
 let cls="r"+Math.min(s,5);return {score:s,label:lab,cls,reason:r.join("・")||modeName()+"基準未達"};
}
function vals(m){let o={};m.fields?.forEach(f=>o[f.id]=document.querySelector(`[data-id="${f.id}"]`)?.value);return o}
function fields(m,x={}){return (m.fields||[]).map(f=>`<div class=field><label>${f.label}</label>${f.type==="select"?`<select data-id="${f.id}">${f.options.map(o=>`<option ${x[f.id]===o?"selected":""}>${o}</option>`).join("")}</select>`:`<input data-id="${f.id}" type=number inputmode=numeric min=0 value="${x[f.id]??0}">`}</div>`).join("")}

function catMatch(m){if(cat==="all")return true;if(cat==="atype")return !!m.atype;if(cat==="new")return !!m.new;if(cat==="hyena")return !m.atype;return true}
function renderM(){page="m";Q.style.display="";let q=Q.value.toLowerCase(),f=favs(),a=M.slice().sort((x,y)=>x.reading.localeCompare(y.reading,"ja")).filter(m=>catMatch(m)&&(!favOnly||f.includes(m.name))&&(m.name.toLowerCase().includes(q)||m.reading.includes(q)));V.innerHTML=`<div class=chips><button class="chip ${cat==="all"?"sel":""}" onclick="cat='all';renderM()">全部</button><button class="chip ${cat==="hyena"?"sel":""}" onclick="cat='hyena';renderM()">ハイエナ</button><button class="chip ${cat==="atype"?"sel":""}" onclick="cat='atype';renderM()">Aタイプ</button><button class="chip ${cat==="new"?"sel":""}" onclick="cat='new';renderM()">新台</button></div><div class=two><button class=btn onclick="favOnly=false;renderM()">全機種</button><button class=btn onclick="favOnly=true;renderM()">★お気に入り</button></div>`+(a.length?a.map(m=>`<div class="card machine" onclick='openM(${JSON.stringify(m.name)})'><button class=fav onclick='event.stopPropagation();tf(${JSON.stringify(m.name)})'>${f.includes(m.name)?"★":"☆"}</button><div class=name>${m.name}</div><div class=sub>${m.category} / ${m.ceiling}</div>${m.new?'<span class=pill>NEW</span>':""}<span class=pill>${m.atype?"設定5/6判定":modeName()}</span><span class=pill>精度${m.confidence}</span>${m.ev?'<span class=pill>公開EVあり</span>':""}</div>`).join(""):`<div class=empty>該当なし</div>`)}
function openM(n){Q.style.display="none";let m=M.find(x=>x.name===n);if(m.atype){openA(m);return}V.innerHTML=`<button class=back onclick="renderM()">← 機種一覧</button><div class=card><div class=name>${m.name}</div><div class=sub>${modeName()}でProfessional</div>${fields(m)}<div id=res></div>${dossierV5(m)}<button class=compare onclick='addC(${JSON.stringify(n)})'>この台を候補比較に追加</button>${m.settingRefs?settingBox(m):""}<div class=kv><b>天井</b><span>${m.ceiling}</span></div><div class=kv><b>ヤメ時</b><span>${m.quit}</span></div><p class=note>${m.note}</p><p class=note><a href="${m.source}" target=_blank>解析元を開く</a></p></div>`;document.querySelectorAll("[data-id]").forEach(e=>e.oninput=()=>calc(m));document.querySelectorAll("[data-set]").forEach(e=>e.oninput=()=>calcSetting(m));calc(m);if(m.settingRefs)calcSetting(m)}
function calc(m){let x=vals(m),j=judge(m,x),e=adjustedEv(m,x,j);$("#res").innerHTML=`<div class="result ${j.cls}"><div class=grade>${j.label}</div><div class=meta>${j.reason}</div><div class=ev>${e.text}</div><div class=meta>${e.kind} / 精度${e.conf} / ${modeName()}</div></div>`}
function openA(m){let s=m.settingRefs;V.innerHTML=`<button class=back onclick="renderM()">← 機種一覧</button><div class=card><div class=name>${m.name}</div><div class=sub>Aタイプ・高設定ワンチャン判定（設定5/6のみ）</div><div class=field><label>総回転数</label><input data-a="games" type=number inputmode=numeric min=0 value=0></div><div class=two><div class=field><label>BIG回数</label><input data-a="big" type=number inputmode=numeric min=0 value=0></div><div class=field><label>REG回数</label><input data-a="reg" type=number inputmode=numeric min=0 value=0></div></div><div id=ares></div><div class=sbox><div class=stitle>設定5・6 基準値</div><div class=sgrid><div class=sstat><b></b><span>BIG</span></div><div class=sstat><b>設定5</b><span>1/${s.big5}</span></div><div class=sstat><b>設定6</b><span>1/${s.big6}</span></div><div class=sstat><b></b><span>REG</span></div><div class=sstat><b>設定5</b><span>1/${s.reg5}</span></div><div class=sstat><b>設定6</b><span>1/${s.reg6}</span></div><div class=sstat><b></b><span>合算</span></div><div class=sstat><b>設定5</b><span>1/${s.total5}</span></div><div class=sstat><b>設定6</b><span>1/${s.total6}</span></div></div></div><div class=kv><b>天井</b><span>${m.ceiling}</span></div><div class=kv><b>ヤメ時</b><span>${m.quit}</span></div><p class="note warn">「設定5/6域」は実測確率が基準値に近いという意味。設定確定ではない。総回転が少ないほどブレが大きい。</p><p class=note><a href="${m.source}" target=_blank>数値の解析元を開く</a></p></div>`;document.querySelectorAll("[data-a]").forEach(e=>e.oninput=()=>calcA(m));calcA(m)}
function den(g,n){return n>0?(g/n):null}

function calcA(m){let g=+document.querySelector('[data-a="games"]').value,b=+document.querySelector('[data-a="big"]').value,r=+document.querySelector('[data-a="reg"]').value,s=m.settingRefs,bd=den(g,b),rd=den(g,r),td=den(g,b+r);let label="サンプル不足",cls="r1",why="まずは回転数を貯めたい";
 if(g>=1000&&td){
   let p6=(td<=s.total6?1:0)+(rd&&rd<=s.reg6?1:0)+(bd&&bd<=s.big6?0.5:0);
   let p5=(td<=s.total5?1:0)+(rd&&rd<=s.reg5?1:0)+(bd&&bd<=s.big5?0.5:0);
   if(p6>=2){label="🔥 数値上は設定6域";cls="r4";why="合算・REG中心に設定6基準へ到達"}
   else if(p5>=2){label="◎ 数値上は設定5域";cls="r3";why="合算・REG中心に設定5基準へ到達"}
   else if(p5>=1){label="○ 高設定ワンチャン";cls="r2";why="一部が設定5基準"}
   else {label="△ 5・6基準には弱め";cls="r1";why="現時点の実測値は設定5基準未満"}
 }
 let sample=g>=5000?"参考度 高":g>=3000?"参考度 中":g>=1500?"参考度 低〜中":"参考度 低";
 $("#ares").innerHTML=`<div class="result ${cls}"><div class=grade>${label}</div><div class=meta>${why} / ${sample}</div><div class=sgrid style="margin-top:12px"><div class=sstat><b>BIG実測</b><span>${fden(bd)}</span></div><div class=sstat><b>REG実測</b><span>${fden(rd)}</span></div><div class=sstat><b>合算実測</b><span>${fden(td)}</span></div></div></div>`}

<script>
const PROKEY='professional_v6_';
function proGet(k,d){try{return JSON.parse(localStorage.getItem(PROKEY+k))??d}catch(e){return d}}

function proCalc(){
 const g=+pjG.value||0, ceil=+pjCeil.value||0, rate=+pjRate.value||32, speed=+pjSpeed.value||750, ev=+pjEV.value||0;
 const remain=Math.max(0,ceil-g), invest=Math.ceil((remain/rate)*1000/1000)*1000;
 const normalMin=remain/speed*60, extra=+pjExtra.value||0, margin=+pjMargin.value||0, need=normalMin+extra+margin;
 const now=new Date(), parts=pjClose.value.split(':').map(Number), close=new Date(now); close.setHours(parts[0],parts[1],0,0); if(close<now) close.setDate(close.getDate()+1);
 const left=(close-now)/60000, hourly=need>0?Math.round(ev/(need/60)):0;
 const ok=left>=need, caution=!ok && left>=normalMin;
 const latest=new Date(close.getTime()-need*60000);
 const cls=ok?'pro-good':caution?'pro-warn':'pro-bad', verdict=ok?'◎ 時間余裕あり':caution?'△ 取り切れず注意':'× 時間的に見送り';
 pjResult.innerHTML=`<div class="pro-kpi"><small>判定</small><b class="${cls}">${verdict}</b></div>
 <div class="pro-kpi"><small>天井まで推定投資</small><b>約${invest.toLocaleString()}円</b></div>
 <div class="pro-kpi"><small>必要時間目安</small><b>約${Math.ceil(need)}分</b></div>
 <div class="pro-kpi"><small>期待時給目安</small><b>${hourly.toLocaleString()}円/h</b></div>
 <div class="pro-kpi"><small>推奨開始期限</small><b>${latest.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</b></div>
 <div class="pro-kpi"><small>閉店まで</small><b>約${Math.max(0,Math.floor(left))}分</b></div>`;
 window._proLast={g,ceil,rate,speed,ev,invest,need,hourly,verdict,latest:latest.getTime()};
}
function proAddCandidate(){
 if(!window._proLast)proCalc();
 let name=prompt('機種名'); if(!name)return;
 let a=proGet('candidates',[]); a.push({...window._proLast,name,ts:Date.now()}); proSet('candidates',a); proRenderCandidates(); alert('候補に追加しました');
}
function proRenderCandidates(){
 let a=proGet('candidates',[]).sort((x,y)=>y.hourly-x.hourly);
 proCandidateList.innerHTML=a.length?a.map((x,i)=>`<div class="pro-row"><span>${i+1}. ${x.name}<br><small>${x.verdict}</small></span><b>${x.ev.toLocaleString()}円 / ${x.hourly.toLocaleString()}円h</b></div>`).join(''):'<p style="color:#9fb0c6">候補なし</p>';
}
function proSaveLedger(){
 let a=proGet('ledger',[]), inv=+plInvest.value||0, ret=+plReturn.value||0;
 a.push({date:plDate.value||new Date().toISOString().slice(0,10),machine:plMachine.value||'未入力',shop:plShop.value||'',ev:+plEV.value||0,invest:inv,ret,profit:ret-inv});
 proSet('ledger',a); proRenderLedger();
}
function proRenderLedger(){
 let a=proGet('ledger',[]);
 let profit=a.reduce((s,x)=>s+x.profit,0), ev=a.reduce((s,x)=>s+x.ev,0);
 proSummary.innerHTML=`<div class="pro-kpi"><small>累計収支</small><b>${profit>=0?'+':''}${profit.toLocaleString()}円</b></div><div class="pro-kpi"><small>累計期待値</small><b>+${ev.toLocaleString()}円</b></div><div class="pro-kpi"><small>期待値との差</small><b>${profit-ev>=0?'+':''}${(profit-ev).toLocaleString()}円</b></div><div class="pro-kpi"><small>記録数</small><b>${a.length}台</b></div>`;
 proLedgerList.innerHTML=a.slice().reverse().slice(0,30).map(x=>`<div class="pro-row"><span>${x.date} ${x.machine}<br><small>${x.shop}</small></span><b>${x.profit>=0?'+':''}${x.profit.toLocaleString()}円</b></div>`).join('');
 proDraw(a);
}
function proDraw(a){
 let c=proChart,ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#334157';ctx.beginPath();ctx.moveTo(35,15);ctx.lineTo(35,h-25);ctx.lineTo(w-10,h-25);ctx.stroke();
 if(!a.length)return;
 let p=0,e=0, pts=a.map((x,i)=>{p+=x.profit;e+=x.ev;return {p,e}});
 let vals=pts.flatMap(x=>[x.p,x.e,0]),mn=Math.min(...vals),mx=Math.max(...vals); if(mx===mn)mx=mn+1;
 const Y=v=>15+(mx-v)/(mx-mn)*(h-45), X=i=>35+(w-50)*(pts.length===1?1:i/(pts.length-1));
 [['p','#55e39a'],['e','#ffd166']].forEach(([k,col])=>{ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();pts.forEach((x,i)=>{let xx=X(i),yy=Y(x[k]);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke()});
 ctx.fillStyle='#9fb0c6';ctx.font='16px sans-serif';ctx.fillText('実収支',45,25);ctx.fillText('期待値',115,25);
}
function proSaveSettings(){proSet('settings',{close:psClose.value,speed:+psSpeed.value||750});pjClose.value=psClose.value;pjSpeed.value=psSpeed.value;alert('保存しました')}
function proExport(){let data={ledger:proGet('ledger',[]),candidates:proGet('candidates',[]),settings:proGet('settings',{})};let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='professional-backup.json';a.click();URL.revokeObjectURL(u)}

async function proCheckUpdates(manual=false){
 const st=document.getElementById('proUpdateStatus');
 if(st) st.textContent='更新確認中…';
 try{
   const r=await fetch('./updates.json?ts='+Date.now(),{cache:'no-store'});
   if(!r.ok) throw new Error('HTTP '+r.status);
   const d=await r.json();
   proSet('updates_cache',d);
   proSet('updates_checked_at',Date.now());
   proRenderUpdates(d);
   if(st) st.textContent='最終確認: '+new Date().toLocaleString('ja-JP');
 }catch(e){
   const cached=proGet('updates_cache',null);
   if(cached) proRenderUpdates(cached);
   if(st) st.textContent='更新確認できませんでした。通信復帰後に再確認します。';
 }
}
function proRenderUpdates(d){
 const seen=proGet('updates_seen',0);
 const items=(d&&d.items)||[];
 const fresh=items.filter(x=>(x.id||0)>seen);
 proUpdateBadge.innerHTML=fresh.length?`<span class="pro-update-badge">NEW ${fresh.length}</span>`:'';
 proTabBadge.innerHTML=fresh.length?`<span class="pro-update-badge">${fresh.length}</span>`:'';
 proUpdateList.innerHTML=items.length?items.slice().sort((a,b)=>(b.id||0)-(a.id||0)).map(x=>`<div class="pro-update-item"><b>${(x.id||0)>seen?'NEW　':''}${x.machine||'全体'}</b><br>${x.title||''}<br><small>${x.date||''}${x.source?' ・ '+x.source:''}</small></div>`).join(''):'<p class="pro-update-empty">現在、更新履歴はありません。</p>';
}
function proMarkUpdatesRead(){
 const d=proGet('updates_cache',{items:[]});
 const mx=Math.max(0,...(d.items||[]).map(x=>x.id||0));
 proSet('updates_seen',mx); proRenderUpdates(d);
}
document.addEventListener('DOMContentLoaded',()=>{plDate.value=new Date().toISOString().slice(0,10);let s=proGet('settings',{close:'22:45',speed:750});psClose.value=s.close;psSpeed.value=s.speed;pjClose.value=s.close;pjSpeed.value=s.speed;proRenderLedger();proCheckUpdates(false)});
</script>
