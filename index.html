const $=s=>document.querySelector(s), view=$("#view"), search=$("#search");
let page="machines", favOnly=false;
const store=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const favs=()=>load("favs",[]);
const candidates=()=>load("candidates",[]);
const mode=()=>localStorage.getItem("exchangeMode")||"56";
const modeLabel=()=>mode()==="equal"?"等価":"5.6枚目安";
function nearest(table,g){if(!table||!table.length)return null;let hit=null;for(const x of table)if(g>=x[0])hit=x;return hit}
function evText(m,v){
 if(!m.ev)return "";
 let md=mode();
 if(m.name==="L 東京喰種"){
   let a=nearest(m.ev.at,+v.at),c=nearest(m.ev.cz,+v.cz),s=[];
   if(a)s.push(`AT間公開EV(等価・${a[0]}G): ${a[1]>=0?"+":""}${a[1].toLocaleString()}円`);
   if(c)s.push(`CZ間公開EV(等価・${c[0]}G): ${c[1]>=0?"+":""}${c[1].toLocaleString()}円`);
   return s.join(" / ");
 }
 if(m.name.includes("かぐや")){
   let key=v.reset==="あり"?"reset":v.prev, table=m.ev[key]?.[md], e=nearest(table,+v.g);
   return e?`公開EV(${modeLabel()}・${e[0]}G): ${e[1]>=0?"+":""}${e[1].toLocaleString()}円`:"";
 }
 let table=m.ev[md]||m.ev.equal, e=nearest(table,+v.g);
 return e?`公開EV(${m.ev[md]?modeLabel():"等価"}・${e[0]}G): ${e[1]>=0?"+":""}${e[1].toLocaleString()}円`:"";
}
function judge(m,v){
 const t=m.targets?.[mode()]||m.targets?.equal||{};
 let score=0, reasons=[];
 const add=(n,r)=>{score=Math.max(score,n);if(r)reasons.push(r)};
 if(m.input==="dual"){
   if(+v.at>=t.at) add(3,`AT間 ${v.at}G`);
   if(+v.cz>=t.cz) add(3,`CZ間 ${v.cz}G`);
   if(v.reset==="あり" && +v.cz>=(t.reset||99999)) add(3,"リセットCZ狙い");
   if(+v.at>=t.at+150||+v.cz>=t.cz+100)add(4,"天井接近");
 } else if(m.input==="kaguya"){
   let th=v.reset==="あり"?t.reset:t[v.prev];
   if(+v.g>=th)add(3,`${th}G基準クリア`);
   if(+v.g>=th+100)add(4,"深め");
   if(+v.czmiss>=4)add(4,"CZ4スルー以上");
 } else if(m.input==="cycle"){
   let rg=v.reset==="あり"?t.resetg:t.g, rc=v.reset==="あり"?t.resetcycle:t.cycle;
   if(+v.g>=rg)add(3,"G数基準");
   if(+v.cycle>=rc)add(3,"周期基準");
   if(+v.g>=rg+150||+v.cycle>=rc+1)add(4,"深め/周期進行");
 } else if(m.input==="karakuri2"){
   if(+v.czg>=t.czg)add(3,"CZ間基準");
   if(+v.atg>=t.atg)add(3,"AT間基準");
   if(+v.czmiss>=4)add(5,"CZ4スルー→次回強力");
   if(+v.czg>=t.czg+120||+v.atg>=t.atg+300)add(4,"天井接近");
 } else if(m.input==="miss"){
   let th=(v.reset==="あり"&&t.reset)?t.reset:t.g;
   if(+v.g>=th)add(3,"G数基準");
   if(+v.miss>=3)add(3,"スルー回数");
   if(+v.miss>=5)add(5,"スルー天井接近");
   if(+v.pt>=400)add(3,"ポイント条件");
 } else if(m.input==="okinawa"){
   if(+v.g>=t.g)add(2,"G数基準");
   if(+v.miss>=3)add(3,"スルー回数");
   if(v.state&&v.state!=="不明"&&!v.state.includes("通常"))add(3,"モード/区間示唆");
   if(+v.miss>=5)add(4,"多スルー");
 } else if(m.input==="miles"){
   if(+v.g>=t.g)add(3,"マイル基準");
   if(+v.miss>=4)add(3,"CZスルー");
   if(+v.miss>=6)add(5,"CZ天井直前");
 } else if(m.input==="abeshi"){
   if(+v.g>=t.g)add(3,"G数基準");
   if(+v.pt>=1000)add(3,"あべし深め");
   if(+v.pt>=1300)add(4,"あべし天井接近");
 } else {
   if(+v.g>=t.g)add(3,`${t.g}G基準クリア`);
   if(+v.g>=t.g+150)add(4,"深め");
   if(v.short==="あり")add(3,"短縮示唆あり");
 }
 let label,cls;
 if(score>=5){label="🔥🔥 最優先";cls="r-fire"}
 else if(score>=4){label="🔥 強い";cls="r-hot"}
 else if(score>=3){label="○ 打てる";cls="r-good"}
 else if(score>=2){label="△ 条件次第";cls="r-mid"}
 else {label="× 見送り";cls="r-bad"}
 return {score,label,cls,reason:reasons.join("・")||`${modeLabel()}基準未達`, ev:evText(m,v)}
}
function inputs(m,vals={}){
 return m.fields.map(f=>`<div class="field"><label>${f.label}</label>${f.type==="select"?`<select data-id="${f.id}">${f.options.map(o=>`<option ${vals[f.id]===o?"selected":""}>${o}</option>`).join("")}</select>`:`<input data-id="${f.id}" type="number" inputmode="numeric" min="0" value="${vals[f.id]??0}">`}</div>`).join("");
}
function toggleFav(name){let f=favs();store("favs",f.includes(name)?f.filter(x=>x!==name):[...f,name]);renderMachines()}
function renderMachines(){
 page="machines";search.style.display="";
 let q=search.value.trim().toLowerCase(), f=favs();
 let arr=MACHINES.slice().sort((a,b)=>a.reading.localeCompare(b.reading,"ja"))
 .filter(m=>(!favOnly||f.includes(m.name))&&(m.name.toLowerCase().includes(q)||m.reading.includes(q)));
 view.innerHTML=`<div class="two"><button class="smallBtn" onclick="favOnly=false;renderMachines()">全機種</button><button class="smallBtn" onclick="favOnly=true;renderMachines()">★ お気に入り</button></div>`+
 (arr.length?arr.map(m=>`<div class="card machine" onclick='openMachine(${JSON.stringify(m.name)})'><button class="fav" onclick='event.stopPropagation();toggleFav(${JSON.stringify(m.name)})'>${f.includes(m.name)?"★":"☆"}</button><div class="name">${m.name}</div><div class="sub">${m.ceiling}</div><span class="pill">${m.fields.length}項目判定</span><span class="pill">${modeLabel()}</span>${m.ev?'<span class="pill">EV表あり</span>':""}</div>`).join(""):`<div class="empty">該当機種なし</div>`);
}
function openMachine(name){
 search.style.display="none";let m=MACHINES.find(x=>x.name===name);
 view.innerHTML=`<button class="back" onclick="search.style.display='';renderMachines()">← 機種一覧</button><div class="card"><div class="name">${m.name}</div><div class="sub">${modeLabel()}で判定中</div>${inputs(m)}<div id="result"></div><button class="compareBtn" onclick="addCandidate(${JSON.stringify(name)})">この台を候補比較に追加</button><div class="section">解析メモ</div><div class="kv"><b>天井</b><span>${m.ceiling}</span></div><div class="kv"><b>ヤメ時</b><span>${m.quit}</span></div><p class="note">${m.note}</p><p class="note"><a href="${m.source}" target="_blank">解析元を開く</a></p></div>`;
 document.querySelectorAll("[data-id]").forEach(x=>x.addEventListener("input",()=>calcDetail(m)));
 calcDetail(m);
}
function currentVals(m){let v={};m.fields.forEach(f=>v[f.id]=document.querySelector(`[data-id="${f.id}"]`).value);return v}
function calcDetail(m){let v=currentVals(m),r=judge(m,v);$("#result").innerHTML=`<div class="result ${r.cls}"><div class="grade">${r.label}</div><div class="reason">${r.reason}</div>${r.ev?`<div class="reason" style="margin-top:8px">${r.ev}</div>`:""}</div>`}
function addCandidate(name){
 let m=MACHINES.find(x=>x.name===name),v=currentVals(m),r=judge(m,v),c=candidates();
 c.push({id:Date.now(),name,vals:v,score:r.score,label:r.label,ev:r.ev,reason:r.reason});store("candidates",c);alert("候補比較に追加したよ");}
function renderCompare(){
 page="compare";search.style.display="none";let c=candidates().sort((a,b)=>b.score-a.score);
 view.innerHTML=`<div class="card"><div class="name">候補台ランキング</div><p class="note">同じホールで拾った台を追加して、優先度の高い順に並べる。円期待値がない機種は判定スコアで比較。</p></div>`+
 (c.length?c.map((x,i)=>`<div class="card row"><div class="rank">#${i+1}</div><div class="grow"><div class="name">${x.name}</div><div class="sub">${x.label} / ${x.reason}</div>${x.ev?`<div class="score">${x.ev}</div>`:""}</div><button class="delete" onclick="delCandidate(${x.id})">削除</button></div>`).join(""):`<div class="empty">まだ候補台がないよ。<br>機種詳細から「候補比較に追加」で登録。</div>`) + (c.length?`<button class="smallBtn" onclick="store('candidates',[]);renderCompare()">候補を全部クリア</button>`:"");
}
function delCandidate(id){store("candidates",candidates().filter(x=>x.id!==id));renderCompare()}
function renderSettings(){
 page="settings";search.style.display="none";let md=mode();
 view.innerHTML=`<div class="card"><div class="settingTitle">交換条件</div><div class="toggle"><button class="${md==="equal"?"sel":""}" onclick="setMode('equal')">等価</button><button class="${md==="56"?"sel":""}" onclick="setMode('56')">5.6枚目安</button></div><p class="note">普段は非等価なら5.6枚目安を推奨。持ちメダル時は実際の条件で狙い目を少し下げられる場合あり。</p></div><div class="card"><div class="settingTitle">このアプリについて</div><p class="warn">期待値は公開解析で明示されている機種だけ表示。条件が複雑な機種で、根拠のない円期待値は作っていない。示唆・モード・有利区間・差枚状況で狙い目は変わる。</p><div class="kv"><b>収録</b><span>${MACHINES.length}機種</span></div><div class="kv"><b>保存</b><span>お気に入り・候補は端末内</span></div><div class="kv"><b>通信</b><span>一度開けば基本画面はオフライン対応</span></div></div>`;
}
function setMode(m){localStorage.setItem("exchangeMode",m);renderSettings()}
$("#n-mach").onclick=()=>{setNav("n-mach");renderMachines()};$("#n-comp").onclick=()=>{setNav("n-comp");renderCompare()};$("#n-set").onclick=()=>{setNav("n-set");renderSettings()};
function setNav(id){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));$("#"+id).classList.add("on")}
search.oninput=()=>{if(page==="machines")renderMachines()};
renderMachines();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
