function mechExpectedRemainingForMode(cfg,mode,count){
 const arr=cfg.thresholds[mode]||[];
 const possible=arr.filter(([t,p])=>t>count);
 const z=possible.reduce((s,x)=>s+x[1],0);
 if(!z)return 0;
 return possible.reduce((s,[t,p])=>s+(t-count)*(p/z),0);
}

 return `<div class=sectionV5><h3>🔗 情報元・更新</h3><div class=cueRow><b>主参照:</b> ${src||"解析元確認中"}</div><div class=cueRow><b>Professional:</b> Ver.9.4 データ統合版</div><div class=stateHint>サイトごとに数値定義が違う場合は同じ指標か確認してから統合。未確定は確定値へ混ぜません。</div></div>`;
}

function proPractical(m){
 const d=proRich(m),s=proStateGet(m);
 let notes=[];
 if(!s.firstHit && s.morning==="リセット") notes.push({t:"🌅 朝一",v:d.morning.reset});
 if(s.state!=="通常") notes.push({t:"🔁 現在状態",v:s.state});
 if(d.states.some(x=>x.includes("駆け抜け"))) notes.push({t:"🏃 駆け抜け",v:"駆け抜け後は機種によって天井短縮・モード・引き戻し等が変わるため、現在状態を必ず選択。"});
 if(d.states.some(x=>x.includes("有利区間"))) notes.push({t:"♻️ 有利区間",v:"切断/リセット後の恩恵がある機種。確定解析と実戦推測をラベルで分離。"});
 if(d.special.some(x=>x.includes("スルー"))) notes.push({t:"🔢 スルー",v:"CZ/ボーナスのスルー回数を狙い目判断に使う機種。"});
 if(d.cues.length) notes.push({t:"👀 示唆",v:`${d.cues.length}件の主要示唆を収録。終了画面・トロフィー・枚数等を確認。`});
 return `<div class=sectionV5><h3>⚡ 状態別チェック</h3><div class=proMiniGrid>${notes.slice(0,6).map(n=>`<div class=proMini><b>${n.t}</b>${n.v}</div>`).join("")||`<div class=proMini>この機種の状態別詳細は解析確認中。</div>`}</div></div>`;
}
function proSessionCue(m,label){
 let key="cue_"+m.name, a=proGet(key,[]);
 a.unshift({time:new Date().toISOString(),label}); a=a.slice(0,30); proSet(key,a);
 const el=document.getElementById("proCueLog"); if(el)el.innerHTML=proCueLog(m);
}
function proCueLog(m){
 const a=proGet("cue_"+m.name,[]);
 if(!a.length)return '<div class=stateHint>今日出た示唆をワンタップで残せます。</div>';
 return a.slice(0,8).map(x=>`<div class=cueRow>${new Date(x.time).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}　${x.label}</div>`).join("");
}
function proCueRecorder(m){
 const d=proRich(m);
 const btns=(d.cues||[]).slice(0,8);
 if(!btns.length)return "";
 return `<div class=sectionV5><h3>📝 今日出た示唆を記録</h3><div class=chips>${btns.map((x,i)=>`<button class=chip onclick='proSessionCue(current,proRich(current).cues[${i}])'>＋ ${x}</button>`).join("")}</div><div id=proCueLog>${proCueLog(m)}</div></div>`;
}

function proResetSession(m){
 if(!confirm("この機種の朝一状態と今日の示唆履歴をリセットする？"))return;
 localStorage.removeItem("state_"+m.name);
 localStorage.removeItem("cue_"+m.name);
 renderStatePanel(m);
 const el=document.getElementById("proCueLog"); if(el)el.innerHTML=proCueLog(m);
}
function proSessionTools(m){
 return `<div class=sectionV5><h3>🧹 台移動・新しい台</h3><button class=stateBtn onclick='proResetSession(current)'>この台の状態/示唆をリセット</button><div class=stateHint>別台へ移動した時に朝一・駆け抜け・示唆履歴が混ざるのを防ぎます。</div></div>`;
}

function proMorningEvidence(m){
 const s=proStateGet(m);
 let text=s.firstHit?"初当り済み：朝一専用条件は解除済み":s.morning==="リセット"?"リセット前提で朝一恩恵を表示中":s.morning==="据え置き"?"据え置き前提で引継ぎを考慮":"リセット/据え置き不明";
 return `<div class=proAlert><b>朝一判定:</b> ${text}<br><span class=stateHint>リセット判別材料がある機種は朝一欄に追記。見た目だけで判別困難な機種もあるため断定しない。</span></div>`;
}

function proBinScore(k,n,p){if(!n)return 0;p=Math.max(.0001,Math.min(.9999,p));return k*Math.log(p)+(n-k)*Math.log(1-p)}
function proPoisScore(k,g,d){if(!g||!d)return 0;let l=g/d;return k*Math.log(Math.max(l,.0001))-l}
function proSettingScore(m,x){
 let sc=[0,0,0,0,0,0], used=[0,0,0,0,0,0], r=PRO_SETTING_RATES[m.name]||{}, g=+x.games||0;
 const pctPairs={pull:["pull_hits","pull_trials"],cz100:["cz100_hits","cz100_trials"],chance_cz:["chance_cz","chance_trials"],strong_cz:["strong_cz","strong_trials"],lv12:["lv12_hits","lv12_trials"],highmode:["highmode","mode_trials"]};
 Object.keys(r).forEach(k=>{
   const arr=r[k]; if(!Array.isArray(arr))return;
   if(pctPairs[k]){
     const [hk,nk]=pctPairs[k], n=+x[nk]||0, hit=+x[hk]||0; if(!n)return;
     for(let i=0;i<6;i++)if(arr[i]!=null){sc[i]+=proBinScore(hit,n,arr[i]/100);used[i]++}
   }else{
     const count=+x[k]||0; if(!g || x[k]===undefined)return;
     for(let i=0;i<6;i++)if(arr[i]!=null){sc[i]+=proPoisScore(count,g,arr[i]);used[i]++}
   }
 });
 let min=0,hint=x.hint||"";
 if(hint.includes("2以上"))min=1;if(hint.includes("3以上"))min=2;if(hint.includes("4以上"))min=3;if(hint.includes("5以上")||hint.includes("5以上示唆"))min=4;
 if(hint.includes("6濃厚"))min=5;
 for(let i=0;i<min;i++)sc[i]=-999;
 const valid=sc.map((v,i)=>used[i]>0||i>=min);
 let mx=Math.max(...sc.filter((v,i)=>valid[i]&&v>-900));
 if(!isFinite(mx))mx=0;
 let ex=sc.map((v,i)=>!valid[i]||v<-900?0:Math.exp(v-mx)),sum=ex.reduce((a,b)=>a+b,0)||1;
 return {pct:ex.map(v=>v/sum*100),used};
}

  morning:{reset:"リセット時の専用条件は解析確認中。判明した内容はここへ追加",carry:"据え置き/不明時は通常条件で判定",clear:"初回当選後は朝一フラグを解除"},
  states:["通常","朝一リセット","CZ失敗後","AT駆け抜け後","AT後"],
  stats:[],
  cues:[],
  special:[]
 };
}
function proStateKey(m){return "state_"+m.name}
function proStateGet(m){return proGet(proStateKey(m),{morning:"不明",firstHit:false,state:"通常"})}
function proStateSet(m,k,v){
 let s=proStateGet(m); s[k]=v;
 if(k==="firstHit"&&v===true){s.morning="解除"; if(s.state==="朝一リセット")s.state="通常";}
 proSet(proStateKey(m),s); renderStatePanel(m);
}
function renderStatePanel(m){
 const box=document.getElementById("proStateBox"); if(!box)return;

 const morningActive=!s.firstHit && s.morning!=="解除";
 box.innerHTML=`<div class=statePanel><h3>🌅 朝一専用</h3>
  <div class=stateGrid>
   ${["リセット","据え置き","不明"].map(v=>`<button class="stateBtn ${s.morning===v?"on":""}" onclick='proStateSet(current,"morning","${v}")' ${s.firstHit?"disabled":""}>${v}</button>`).join("")}
   <button class="stateBtn ${s.firstHit?"on":""}" onclick='proStateSet(current,"firstHit",${!s.firstHit})'>${s.firstHit?"✓ 初当り済み":"初当りした"}</button>
  </div>
  <div class=stateHint>${s.morning==="リセット"&&morningActive?d.morning.reset:s.morning==="据え置き"&&morningActive?d.morning.carry:s.firstHit?d.morning.clear:"リセットか据え置きを選択。初当り後は朝一条件を自動解除できます。"}</div>
 </div>
 <div class=statePanel><h3>🔁 現在の状態</h3>
  <select onchange='proStateSet(current,"state",this.value)'>${proStateChoices(m).map(v=>`<option ${s.state===v?"selected":""}>${v}</option>`).join("")}</select>
  <div class=stateHint>駆け抜け後・CZ失敗後・AT後など、機種ごとの状態差をここで保持。状態別の解析がある台は判定条件へ反映できる構造です。</div>
 </div>${proMorningEvidence(m)}`;
}

function proQuickFive(m){
 const d=proRich(m),s=proStateGet(m),a=[];
 if(!s.firstHit) a.push(`朝一: ${s.morning}`);
 if(d.states.includes("AT駆け抜け後")) a.push("駆け抜け後の状態確認");
 if(d.stats.length) a.push("4/5/6 初当り・CZ差");
 if(d.cues.length) a.push("終了画面/確定示唆");

}

function renderSettingDetail(m){
 const d=proRich(m);
 let stats=d.stats.length?`<table class=cheatTable><tr><th>項目</th>${[1,2,3,4,5,6].map(x=>`<th>${x}</th>`).join("")}</tr>${d.stats.map(r=>`<tr>${r.map((x,i)=>i?`<td>${x}</td>`:`<td>${x}</td>`).join("")}</tr>`).join("")}</table>`:`<div class=stateHint>設定1〜6の公開数値を追加調査中。未公表値は作らず、未確定情報はラベル付きで追加します。</div>`;
 let cues=d.cues.length?d.cues.map(x=>`<div class=cueRow>${x}</div>`).join(""):`<div class=stateHint>終了画面・トロフィー・獲得枚数・ボイス等を追加調査中。</div>`;
 let sp=d.special.length?d.special.map(x=>`<span class=chip>${x}</span>`).join(" "):"";
 return `<div class=sectionV5><h3>🔄 上位AT・上位CZ・駆け抜け後</h3>${proSpecialStates(m)}<div class=confNote>上位後・失敗後・駆け抜け後で条件が変わる機種は通常状態と分離。</div></div><div class=sectionV5><h3>🧪 未確定でも使える数字</h3>${proUnconfirmedNumeric(m)}<div class=confNote>具体値が出ている情報は未確定でも掲載。信頼度を必ず表示し、公式解析値とは混ぜません。</div></div><div class=sectionV5><h3>📊 設定1〜6 詳細</h3>${stats}</div>
 <div class=sectionV5><h3>🖼️ 設定示唆・確定系</h3>${cues}<div class=stateHint>画像そのものではなく、画面名・キャラ・枠色・示唆内容を文字で即確認できる形にします。</div></div>
 <div class=sectionV5><h3>🎯 判別で見る特殊項目</h3><div>${sp||"解析確認中"}</div></div>`;
}

function proMachineEstimate(m,x,e){
  let targets=[];
  const isYes=v=>String(v||"").includes("あり");
  const ps=proStateGet(m);
  const morningReset=(!ps.firstHit && ps.morning==="リセット");

  if(m.name==="L 東京喰種"){
    const czCeil=(morningReset||isYes(x.reset))?200:600;
    targets.push({label:"CZ天井まで",cur:+x.cz||0,ceil:czCeil});
    targets.push({label:"AT天井まで",cur:+x.at||0,ceil:1200});
  }else if(m.name==="Lパチスロ かぐや様は告らせたい"){
    const ceil=(morningReset||isYes(x.reset))?800:(String(x.prev||"BIG")==="REG"?900:1100);
    targets.push({label:"ボーナス天井まで",cur:+x.g||0,ceil});
  }else if(m.name==="スマスロ モンキーターンV"){
    targets.push({label:"G数天井まで",cur:+x.g||0,ceil:(morningReset||isYes(x.reset))?495:795});
  }else{
    let cur=Number(x.g);
    if(!Number.isFinite(cur)){
      if(Number.isFinite(Number(x.at))) cur=Number(x.at);
      else if(Number.isFinite(Number(x.cz))) cur=Number(x.cz);
    }
    if(Number.isFinite(cur)){
      const txt=String(m.ceiling||"");
      let nums=[...txt.matchAll(/(\d{2,4})\s*G/g)].map(z=>+z[1]).filter(n=>n>=100);
      if(nums.length){
        let ceil=Math.max(...nums);
        if(morningReset||isYes(x.reset)){
          const rm=txt.match(/リセット[^0-9]{0,12}(\d{2,4})\s*G/);
          if(rm) ceil=+rm[1];
        }
        targets.push({label:"天井まで",cur,ceil});
      }
    }
  }

  const sr=proRuleEstimate(m,x);
  if(sr && sr.rule.ceiling!=null){
    const labelUnit=sr.rule.metric==="point"?"pt":sr.rule.metric==="abesi"?"あべし":sr.rule.metric==="mile"?"マイル":"";
    const exists=targets.some(t=>t.ceil===sr.rule.ceiling && t.cur===sr.cur);
    if(!exists) targets.unshift({label:`${sr.rule.state} 上限まで${labelUnit?` (${labelUnit})`:""}`,cur:sr.cur,ceil:sr.rule.ceiling});
  }

  if(!targets.length){
    return `<div class=autoEstimate>
      <div class=autoEstimateTitle>💰 自動投資・時間予測</div>
      <div class=autoEstimateNote>この機種はG数だけで投資額を出せないタイプ、または天井数値が未収録です。周期・スルー・モード等を優先して判定します。</div>
    </div>`;
  }

  const settings=proGet("settings",{close:"22:45",speed:750});
  const speed=Number(settings.speed)||750;
  const rate=(m.proRate&&Number(m.proRate)>0)?Number(m.proRate):32;
  const rateLabel=m.proRate?"機種別登録値":"暫定基準";

  // Nearest ceiling-type event is used for the headline investment.
  const primary=targets.slice().sort((a,b)=>(a.ceil-a.cur)-(b.ceil-b.cur))[0];
  const remain=Math.max(0,primary.ceil-primary.cur);
  const invest=Math.ceil((remain/rate))*1000;
  const normalMin=remain/speed*60;
  const extra=45;
  const margin=20;
  const need=normalMin+extra+margin;

  let closeText="—";
  let verdict="閉店時間未設定";
  const cp=String(settings.close||"22:45").split(":").map(Number);
  if(cp.length===2){
    const now=new Date();
    const close=new Date(now);
    close.setHours(cp[0],cp[1],0,0);
    if(close<now) close.setDate(close.getDate()+1);
    const left=(close-now)/60000;
    const latest=new Date(close.getTime()-need*60000);
    verdict=left>=need?"◎ 時間余裕あり":(left>=normalMin?"△ 取り切れず注意":"× 時間的に見送り");
    closeText=latest.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
  }

  let evNum=null;
  if(e && typeof e.value==="number") evNum=e.value;
  else if(e && typeof e.ev==="number") evNum=e.ev;
  const hourly=(evNum!=null && need>0)?Math.round(evNum/(need/60)):null;
  const targetLine=targets.map(t=>`${t.label} ${Math.max(0,t.ceil-t.cur)}G`).join(" / ");

  window._proMachineLast={
    name:m.displayName||m.name,
    invest,remain,need,verdict,latest:closeText,ev:evNum
  };

  return `<div class=autoEstimate>
    <div class=autoEstimateTitle>💰 G数入力から自動計算</div>
    <div class=autoEstimateGrid>
      <div class=autoEstimateCell><small>推定投資額</small><b>約${invest.toLocaleString()}円</b></div>
      <div class=autoEstimateCell><small>天井まで</small><b>${targetLine}</b></div>
      <div class=autoEstimateCell><small>推定必要時間</small><b>約${Math.ceil(need)}分</b></div>
      <div class=autoEstimateCell><small>閉店判定</small><b>${verdict}</b></div>
      <div class=autoEstimateCell><small>推奨開始期限</small><b>${closeText}</b></div>
      <div class=autoEstimateCell><small>期待時給</small><b>${hourly==null?"期待値表未収録":hourly.toLocaleString()+"円/h"}</b></div>
    </div>
    <div class=autoEstimateNote>
      推定投資は「今のG数から天井到達まで」を ${rate}G/千円（${rateLabel}）で計算した上限寄りの概算です。途中当選すれば実投資は小さくなります。機種別の回転率を確認できた台から自動で置き換えられる設計です。
    </div>
  </div>`;
}

function calc(m){
 let x=vals(m),j=judge(m,x),e=adjustedEv(m,x,j);
 $("#res").innerHTML=`<div class="result ${j.cls}"><div class=grade>${j.label}</div><div class=meta>${j.reason}</div><div class=ev>${e.text}</div><div class=meta>${e.kind} / 精度${e.conf} / ${modeName()}</div>${proMachineEstimate(m,x,e)}${proMechanicalEv(m,x)}${proATypeLive(m,x)}${proATypeReference(m,x)}</div>`;
}
function openA(m){let s=m.settingRefs;current=m;if(PRO_MACHINE_TAB==='setting'){V.innerHTML=`<button class=back onclick="renderM()">← 機種一覧</button><div class=card>${proTabs(m)}<div class=name>${m.name}</div><div id=proSettingPane>${proSettingPane(m)}</div></div>`;return}V.innerHTML=`<button class=back onclick="renderM()">← 機種一覧</button><div class=card><div class=name>${m.name}</div><div class=sub>Aタイプ・高設定ワンチャン判定（設定5/6のみ）</div><div class=field><label>総回転数</label><input data-a="games" type=number inputmode=numeric min=0 value=0></div><div class=two><div class=field><label>BIG回数</label><input data-a="big" type=number inputmode=numeric min=0 value=0></div><div class=field><label>REG回数</label><input data-a="reg" type=number inputmode=numeric min=0 value=0></div></div><div id=ares></div><div class=sbox><div class=stitle>設定5・6 基準値</div><div class=sgrid><div class=sstat><b></b><span>BIG</span></div><div class=sstat><b>設定5</b><span>1/${s.big5}</span></div><div class=sstat><b>設定6</b><span>1/${s.big6}</span></div><div class=sstat><b></b><span>REG</span></div><div class=sstat><b>設定5</b><span>1/${s.reg5}</span></div><div class=sstat><b>設定6</b><span>1/${s.reg6}</span></div><div class=sstat><b></b><span>合算</span></div><div class=sstat><b>設定5</b><span>1/${s.total5}</span></div><div class=sstat><b>設定6</b><span>1/${s.total6}</span></div></div></div><div class=kv><b>天井</b><span>${m.ceiling}</span></div><div class=kv><b>ヤメ時</b><span>${m.quit}</span></div><p class="note warn">「設定5/6域」は実測確率が基準値に近いという意味。設定確定ではない。総回転が少ないほどブレが大きい。</p><p class=note><a href="${m.source}" target=_blank>数値の解析元を開く</a></p></div>`;document.querySelectorAll("[data-a]").forEach(e=>e.oninput=()=>calcA(m));calcA(m)}
function den(g,n){return n>0?(g/n):null}
function fden(x){return x?`1/${Math.round(x*10)/10}`:"—"}
function calcA(m){let g=+document.querySelector('[data-a="games"]').value,b=+document.querySelector('[data-a="big"]').value,r=+document.querySelector('[data-a="reg"]').value,s=m.settingRefs,bd=den(g,b),rd=den(g,r),td=den(g,b+r);let label="サンプル不足",cls="r1",why="まずは回転数を貯めたい";
 if(g>=1000&&td){
   let p6=(td<=s.total6?1:0)+(rd&&rd<=s.reg6?1:0)+(bd&&bd<=s.big6?0.5:0);
   let p5=(td<=s.total5?1:0)+(rd&&rd<=s.reg5?1:0)+(bd&&bd<=s.big5?0.5:0);
   if(p6>=2){label="🔥 数値上は設定6域";cls="r4";why="合算・REG中心に設定6基準へ到達"}
   else if(p5>=2){label="◎ 数値上は設定5域";cls="r3";why="合算・REG中心に設定5基準へ到達"}
   else if(p5>=1){label="○ 高設定ワンチャン";cls="r2";why="一部が設定5基準"}
   else {label="△ 5・6基準には弱め";cls="r1";why="現時点の実測値は設定5基準未満"}
 }
 let sample=g>=5000?"参考度 高":g>=3000?"参考度 中":g>=1500?"参考度 低〜中":"参考度 低";
 $("#ares").innerHTML=`<div class="result ${cls}"><div class=grade>${label}</div><div class=meta>${why} / ${sample}</div><div class=sgrid style="margin-top:12px"><div class=sstat><b>BIG実測</b><span>${fden(bd)}</span></div><div class=sstat><b>REG実測</b><span>${fden(rd)}</span></div><div class=sstat><b>合算実測</b><span>${fden(td)}</span></div></div></div>`}
function settingBox(m){let s=m.settingRefs;return `<div class=sbox><div class=stitle>高設定ワンチャン（設定5/6）</div><div class=field><label>通常時G</label><input data-set="games" type=number inputmode=numeric min=0 value=0></div>${s.metrics.map(a=>`<div class=field><label>${a.label} 回数</label><input data-set="${a.id}" type=number inputmode=numeric min=0 value=0></div>`).join("")}<div id=sres class=note></div><div class=sgrid>${s.metrics.map(a=>`<div class=sstat><b>${a.label} 設5</b><span>1/${a.s5}</span></div><div class=sstat><b>${a.label} 設6</b><span>1/${a.s6}</span></div><div class=sstat><b>実測</b><span id="obs-${a.id}">—</span></div>`).join("")}</div></div>`}
function calcSetting(m){let g=+document.querySelector('[data-set="games"]')?.value||0, msgs=[];m.settingRefs.metrics.forEach(a=>{let n=+document.querySelector(`[data-set="${a.id}"]`)?.value||0,d=den(g,n),el=document.querySelector(`#obs-${a.id}`);if(el)el.textContent=fden(d);if(d){if(d<=a.s6)msgs.push(`${a.label}: 設6域`);else if(d<=a.s5)msgs.push(`${a.label}: 設5域`);else msgs.push(`${a.label}: 5未満`)}});let e=$("#sres");if(e)e.textContent=(msgs.join(" / ")||"履歴を入れると実測値を比較")+"　※確率だけで設定確定は不可"}
function addC(n){let m=M.find(x=>x.name===n),x=vals(m),j=judge(m,x),e=adjustedEv(m,x,j),c=cans();c.push({id:Date.now(),name:n,score:j.score,label:j.label,ev:e.text,kind:e.kind,conf:e.conf});save("candidates",c);alert("候補比較に追加したよ")}
function renderC(){page="c";Q.style.display="none";let c=cans().sort((a,b)=>b.score-a.score);V.innerHTML=`<div class=card><div class=name>候補台ランキング</div><p class=note>ハイエナ候補の比較用。Aタイプは設定ワンチャン画面で判断。</p></div>`+(c.length?c.map((x,i)=>`<div class="card row"><div class=rank>#${i+1}</div><div class=grow><div class=name>${x.name}</div><div class=sub>${x.label} / ${x.ev} / 精度${x.conf}</div></div><button class=del onclick="delC(${x.id})">削除</button></div>`).join(""):`<div class=empty>候補台なし</div>`)}
function delC(id){save("candidates",cans().filter(x=>x.id!==id));renderC()}
function renderS(){page="s";Q.style.display="none";let md=mode();V.innerHTML=`<div class=card><div class=name>交換条件</div><div class=modebox><button class="${md==="equal"?"sel":""}" onclick="sm('equal')">等価</button><button class="${md==="held"?"sel":""}" onclick="sm('held')">非等価<br>持ちメダル</button><button class="${md==="cash"?"sel":""}" onclick="sm('cash')">非等価<br>現金</button></div><p class=note>公開EVが等価しか無い台は、非等価時に勝手な円補正をせず「等価公開値」として表示するよう変更。</p></div><div class=card><div class=name>Ver.4 新機能</div><div class=kv><b>Aタイプ</b><span>総G・BIG・REGから実測確率を自動計算</span></div><div class=kv><b>高設定</b><span>設定5・6のみ表示。設定4以下は高設定扱いしない</span></div><div class=kv><b>カテゴリ</b><span>全部 / ハイエナ / Aタイプ / 新台</span></div><div class=kv><b>新台</b><span>青ブタ・かのかり・見える子・モグモグ・喰霊Re・タコスロ等を追加</span></div></div><div class=card><div class=kv><b>収録</b><span>${M.length}機種</span></div><div class=kv><b>Ver.</b><span>4.0 設定ワンチャン対応</span></div></div>`}
function sm(m){localStorage.setItem("mode4",m);renderS()}

$("#nm").onclick=()=>{nav("nm");renderM()};$("#nc").onclick=()=>{nav("nc");renderC()};$("#ns").onclick=()=>{nav("ns");renderS()};Q.oninput=()=>page==="m"&&renderM();renderM();
if("serviceWorker" in navigator){
 navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
}
if("caches" in window){
 caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k))));

    <div class="pro-card">
      <h3>解析アップデート <span id="proUpdateBadge"></span></h3>
      <p style="color:#9fb0c6;font-size:13px">Professional起動時に公開中の更新データを確認します。新しい更新はNEW表示されます。</p>
      <button class="pro-btn" onclick="proCheckUpdates(true)">今すぐ確認</button>
      <div id="proUpdateStatus" class="pro-update-empty"></div>
      <div id="proUpdateList"></div>
      <button class="pro-btn" onclick="proMarkUpdatesRead()">すべて既読にする</button>
    </div>
  </div>
<div id="proSettings" class="pro-panel">
    <div class="pro-card">
      <h3>設定</h3>
      <label>いつもの閉店時間</label><input id="psClose" type="time" value="22:45">
      <label>通常時の基準消化速度（G/時）</label><input id="psSpeed" type="number" value="750">
      <button class="pro-btn" onclick="proSaveSettings()">保存</button>
      <p style="color:#9fb0c6;font-size:12px">収支・設定はこの端末のブラウザ内に保存されます。大事な記録はバックアップ推奨。</p>
    </div>
  </div>

  <nav class="pro-tabs">
    <button onclick="proTab('judge',this)">判定</button>
    <button onclick="proTab('candidates',this)">候補</button>
    <button onclick="proTab('ledger',this)">収支</button>
    <button onclick="proTab('updates',this)">更新 <span id="proTabBadge"></span></button>
    <button onclick="proTab('settings',this)">設定</button>
  </nav>
</div>

<script>
const PROKEY='professional_v6_';
function proGet(k,d){try{return JSON.parse(localStorage.getItem(PROKEY+k))??d}catch(e){return d}}
function proSet(k,v){localStorage.setItem(PROKEY+k,JSON.stringify(v))}
function proTab(name,btn){
  document.querySelectorAll('.pro-panel').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pro-tabs button').forEach(x=>x.classList.remove('on'));
  document.getElementById('pro'+name[0].toUpperCase()+name.slice(1)).classList.add('on');
  btn.classList.add('on');
  if(name==='ledger')proRenderLedger();
  if(name==='candidates')proRenderCandidates();
}
function proCalc(){
 const g=+pjG.value||0, ceil=+pjCeil.value||0, rate=+pjRate.value||32, speed=+pjSpeed.value||750, ev=+pjEV.value||0;
 const remain=Math.max(0,ceil-g), invest=Math.ceil((remain/rate)*1000/1000)*1000;
 const normalMin=remain/speed*60, extra=+pjExtra.value||0, margin=+pjMargin.value||0, need=normalMin+extra+margin;
 const now=new Date(), parts=pjClose.value.split(':').map(Number), close=new Date(now); close.setHours(parts[0],parts[1],0,0); if(close<now) close.setDate(close.getDate()+1);
 const left=(close-now)/60000, hourly=need>0?Math.round(ev/(need/60)):0;
 const ok=left>=need, caution=!ok && left>=normalMin;
 const latest=new Date(close.getTime()-need*60000);
 const cls=ok?'pro-good':caution?'pro-warn':'pro-bad', verdict=ok?'◎ 時間余裕あり':caution?'△ 取り切れず注意':'× 時間的に見送り';
 pjResult.innerHTML=`<div class="pro-kpi"><small>判定</small><b class="${cls}">${verdict}</b></div>
 <div class="pro-kpi"><small>天井まで推定投資</small><b>約${invest.toLocaleString()}円</b></div>
 <div class="pro-kpi"><small>必要時間目安</small><b>約${Math.ceil(need)}分</b></div>
 <div class="pro-kpi"><small>期待時給目安</small><b>${hourly.toLocaleString()}円/h</b></div>
 <div class="pro-kpi"><small>推奨開始期限</small><b>${latest.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</b></div>
 <div class="pro-kpi"><small>閉店まで</small><b>約${Math.max(0,Math.floor(left))}分</b></div>`;
 window._proLast={g,ceil,rate,speed,ev,invest,need,hourly,verdict,latest:latest.getTime()};
}
function proAddCandidate(){
 if(!window._proLast)proCalc();
 let name=prompt('機種名'); if(!name)return;
 let a=proGet('candidates',[]); a.push({...window._proLast,name,ts:Date.now()}); proSet('candidates',a); proRenderCandidates(); alert('候補に追加しました');
}
function proRenderCandidates(){
 let a=proGet('candidates',[]).sort((x,y)=>y.hourly-x.hourly);
 proCandidateList.innerHTML=a.length?a.map((x,i)=>`<div class="pro-row"><span>${i+1}. ${x.name}<br><small>${x.verdict}</small></span><b>${x.ev.toLocaleString()}円 / ${x.hourly.toLocaleString()}円h</b></div>`).join(''):'<p style="color:#9fb0c6">候補なし</p>';
}
function proSaveLedger(){
 let a=proGet('ledger',[]), inv=+plInvest.value||0, ret=+plReturn.value||0;
 a.push({date:plDate.value||new Date().toISOString().slice(0,10),machine:plMachine.value||'未入力',shop:plShop.value||'',ev:+plEV.value||0,invest:inv,ret,profit:ret-inv});
 proSet('ledger',a); proRenderLedger();
}
function proRenderLedger(){
 let a=proGet('ledger',[]);
 let profit=a.reduce((s,x)=>s+x.profit,0), ev=a.reduce((s,x)=>s+x.ev,0);
 proSummary.innerHTML=`<div class="pro-kpi"><small>累計収支</small><b>${profit>=0?'+':''}${profit.toLocaleString()}円</b></div><div class="pro-kpi"><small>累計期待値</small><b>+${ev.toLocaleString()}円</b></div><div class="pro-kpi"><small>期待値との差</small><b>${profit-ev>=0?'+':''}${(profit-ev).toLocaleString()}円</b></div><div class="pro-kpi"><small>記録数</small><b>${a.length}台</b></div>`;
 proLedgerList.innerHTML=a.slice().reverse().slice(0,30).map(x=>`<div class="pro-row"><span>${x.date} ${x.machine}<br><small>${x.shop}</small></span><b>${x.profit>=0?'+':''}${x.profit.toLocaleString()}円</b></div>`).join('');
 proDraw(a);
}
function proDraw(a){
 let c=proChart,ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#334157';ctx.beginPath();ctx.moveTo(35,15);ctx.lineTo(35,h-25);ctx.lineTo(w-10,h-25);ctx.stroke();
 if(!a.length)return;
 let p=0,e=0, pts=a.map((x,i)=>{p+=x.profit;e+=x.ev;return {p,e}});
 let vals=pts.flatMap(x=>[x.p,x.e,0]),mn=Math.min(...vals),mx=Math.max(...vals); if(mx===mn)mx=mn+1;
 const Y=v=>15+(mx-v)/(mx-mn)*(h-45), X=i=>35+(w-50)*(pts.length===1?1:i/(pts.length-1));
 [['p','#55e39a'],['e','#ffd166']].forEach(([k,col])=>{ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();pts.forEach((x,i)=>{let xx=X(i),yy=Y(x[k]);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)});ctx.stroke()});
 ctx.fillStyle='#9fb0c6';ctx.font='16px sans-serif';ctx.fillText('実収支',45,25);ctx.fillText('期待値',115,25);
}
function proSaveSettings(){proSet('settings',{close:psClose.value,speed:+psSpeed.value||750});pjClose.value=psClose.value;pjSpeed.value=psSpeed.value;alert('保存しました')}
function proExport(){let data={ledger:proGet('ledger',[]),candidates:proGet('candidates',[]),settings:proGet('settings',{})};let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='professional-backup.json';a.click();URL.revokeObjectURL(u)}

async function proCheckUpdates(manual=false){
 const st=document.getElementById('proUpdateStatus');
 if(st) st.textContent='更新確認中…';
 try{
   const r=await fetch('./updates.json?ts='+Date.now(),{cache:'no-store'});
   if(!r.ok) throw new Error('HTTP '+r.status);
   const d=await r.json();
   proSet('updates_cache',d);
   proSet('updates_checked_at',Date.now());
   proRenderUpdates(d);
   if(st) st.textContent='最終確認: '+new Date().toLocaleString('ja-JP');
 }catch(e){
   const cached=proGet('updates_cache',null);
   if(cached) proRenderUpdates(cached);
   if(st) st.textContent='更新確認できませんでした。通信復帰後に再確認します。';
 }
}
function proRenderUpdates(d){
 const seen=proGet('updates_seen',0);
 const items=(d&&d.items)||[];
 const fresh=items.filter(x=>(x.id||0)>seen);
 proUpdateBadge.innerHTML=fresh.length?`<span class="pro-update-badge">NEW ${fresh.length}</span>`:'';
 proTabBadge.innerHTML=fresh.length?`<span class="pro-update-badge">${fresh.length}</span>`:'';
 proUpdateList.innerHTML=items.length?items.slice().sort((a,b)=>(b.id||0)-(a.id||0)).map(x=>`<div class="pro-update-item"><b>${(x.id||0)>seen?'NEW　':''}${x.machine||'全体'}</b><br>${x.title||''}<br><small>${x.date||''}${x.source?' ・ '+x.source:''}</small></div>`).join(''):'<p class="pro-update-empty">現在、更新履歴はありません。</p>';
}
function proMarkUpdatesRead(){
 const d=proGet('updates_cache',{items:[]});
 const mx=Math.max(0,...(d.items||[]).map(x=>x.id||0));
 proSet('updates_seen',mx); proRenderUpdates(d);
}
document.addEventListener('DOMContentLoaded',()=>{plDate.value=new Date().toISOString().slice(0,10);let s=proGet('settings',{close:'22:45',speed:750});psClose.value=s.close;psSpeed.value=s.speed;pjClose.value=s.close;pjSpeed.value=s.speed;proRenderLedger();proCheckUpdates(false)});

window.addEventListener("error",function(){
 const box=document.getElementById("view");
 if(box && !box.innerHTML.trim()){
  box.innerHTML='<div class="card"><div class="name">表示エラー</div><p class="note">読み込みに失敗しました。Safariで再読み込みしてください。</p></div>';
 }
});

</script>
</body></html>
