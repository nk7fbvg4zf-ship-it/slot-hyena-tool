const $=s=>document.querySelector(s), V=$("#v"), Q=$("#q");
let page="m", favOnly=false;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const favs=()=>load("favs",[]), cans=()=>load("candidates",[]);
const mode=()=>localStorage.getItem("mode3")||"cash";
const modeName=()=>({equal:"等価",held:"非等価・持ちメダル",cash:"非等価・現金"}[mode()]);
function nearest(tab,g){if(!tab)return null;let r=null;for(const x of tab)if(g>=x[0])r=x;return r}
function baseEv(m,val){
 if(!m.ev)return null;
 if(m.name==="L 東京喰種"){
   let a=nearest(m.ev.at,+val.at),c=nearest(m.ev.cz,+val.cz),arr=[a,c].filter(Boolean);
   if(!arr.length)return null; return Math.max(...arr.map(x=>x[1]));
 }
 if(m.name.includes("かぐや")){
   let key=val.reset==="あり"?"reset":val.prev, e=nearest(m.ev[key],+val.g);return e?e[1]:null;
 }
 let e=nearest(m.ev.g,+val.g);return e?e[1]:null;
}
function adjustedEv(m,val,j){
 let b=baseEv(m,val);
 if(b!==null){
   let k=mode()==="equal"?1:mode()==="held"?0.88:0.62;
   let penalty=mode()==="equal"?0:mode()==="held"?150:450;
   let e=Math.round((b*k-penalty)/50)*50;
   return {text:`約 ${e>=0?"+":""}${e.toLocaleString()}円`,kind:mode()==="equal"?"公開値":"公開値ベース補正",conf:mode()==="equal"&&m.confidence==="A"?"A":m.confidence};
 }
 let range;
 if(j.score<=0) range="マイナス域の可能性";
 else if(j.score==1) range="-500〜+500円程度";
 else if(j.score==2) range="+300〜+1,000円程度";
 else if(j.score==3) range="+800〜+1,800円程度";
 else if(j.score==4) range="+1,500〜+3,000円程度";
 else range="+2,500円以上の可能性";
 return {text:range,kind:"推定レンジ",conf:m.confidence||"C"};
}
function judge(m,x){
 const t=m.targets[mode()]||m.targets.cash;let s=0,r=[];
 const up=(n,txt)=>{s=Math.max(s,n);if(txt)r.push(txt)};
 if(m.name==="L 東京喰種"||m.name==="攻殻機動隊 S.A.C."){if(+x.at>=t.at)up(3,"AT間");if(+x.cz>=t.cz)up(3,"CZ間");if(x.reset==="あり"&&t.reset&&+x.cz>=t.reset)up(3,"リセット");if(+x.at>=t.at+150||+x.cz>=t.cz+100)up(4,"天井接近")}
 else if(m.name.includes("かぐや")){let th=x.reset==="あり"?t.reset:t[x.prev];if(+x.g>=th)up(3,"基準クリア");if(+x.g>=th+100)up(4,"深め");if(+x.czmiss>=4)up(5,"CZ4スルー以上")}
 else if(m.name==="スマスロ モンキーターンV"||m.name==="L戦国コレクション6"||m.name==="スマスロ 新鬼武者3"){let g=x.reset==="あり"?t.resetg:t.g,c=x.reset==="あり"?t.resetcycle:t.cycle;if(+x.g>=g)up(3,"G数");if(+x.cycle>=c)up(3,"周期");if(+x.g>=g+150||+x.cycle>=c+1)up(4,"深め/周期進行")}
 else if(m.name.includes("からくりサーカス2")){if(+x.czg>=t.czg)up(3,"CZ間");if(+x.atg>=t.atg)up(3,"AT間");if(+x.czmiss>=4)up(5,"CZ4スルー")}
 else if(m.name.includes("東京リベンジャーズ")||m.name.includes("バイオハザードRE:3")||m.name.includes("ストリートファイター6")){let th=(x.reset==="あり"&&t.reset)?t.reset:t.g;if(+x.g>=th)up(3,"G数");if(+x.miss>=3)up(3,"スルー");if(+x.miss>=5)up(5,"スルー天井接近");if(+x.pt>=400)up(3,"ポイント")}
 else if(m.name.includes("やじきた")){if(+x.g>=t.g)up(3,"マイル");if(+x.miss>=4)up(3,"CZスルー");if(+x.miss>=6)up(5,"CZ天井直前")}
 else if(m.name.includes("沖")){if(+x.g>=t.g)up(2,"G数");if(+x.miss>=3)up(3,"スルー");if(x.state&&x.state!=="不明"&&!x.state.includes("通常"))up(3,"モード/区間示唆");if(+x.miss>=5)up(4,"多スルー")}
 else if(m.name.includes("転生の章2")){if(+x.g>=t.g)up(3,"G数");if(+x.pt>=1000)up(3,"あべし");if(+x.pt>=1300)up(4,"天井接近")}
 else if(m.name.includes("海門決戦")){let th=x.reset==="あり"?t.reset:t.g;if(+x.g>=th)up(3,x.reset==="あり"?"リセット短縮":"G数");if(+x.g>=th+120)up(4,"深め")}
 else {if(+x.g>=t.g)up(3,"基準クリア");if(+x.g>=t.g+150)up(4,"深め");if(x.short==="あり")up(3,"短縮示唆")}
 let lab=["× 見送り","△ 条件次第","○ 打てる","◎ かなりあり","🔥 強い","🔥🔥 最優先"][Math.min(s,5)];
 let cls="r"+Math.min(s,5);return {score:s,label:lab,cls,reason:r.join("・")||modeName()+"基準未達"};
}
function vals(m){let o={};m.fields.forEach(f=>o[f.id]=document.querySelector(`[data-id="${f.id}"]`).value);return o}
function fields(m,x={}){return m.fields.map(f=>`<div class=field><label>${f.label}</label>${f.type==="select"?`<select data-id="${f.id}">${f.options.map(o=>`<option ${x[f.id]===o?"selected":""}>${o}</option>`).join("")}</select>`:`<input data-id="${f.id}" type=number inputmode=numeric min=0 value="${x[f.id]??0}">`}</div>`).join("")}
function tf(n){let f=favs();save("favs",f.includes(n)?f.filter(x=>x!==n):[...f,n]);renderM()}
function renderM(){page="m";Q.style.display="";let q=Q.value.toLowerCase(),f=favs(),a=M.slice().sort((x,y)=>x.reading.localeCompare(y.reading,"ja")).filter(m=>(!favOnly||f.includes(m.name))&&(m.name.toLowerCase().includes(q)||m.reading.includes(q)));V.innerHTML=`<div class=two><button class=btn onclick="favOnly=false;renderM()">全機種</button><button class=btn onclick="favOnly=true;renderM()">★お気に入り</button></div>`+(a.length?a.map(m=>`<div class="card machine" onclick='openM(${JSON.stringify(m.name)})'><button class=fav onclick='event.stopPropagation();tf(${JSON.stringify(m.name)})'>${f.includes(m.name)?"★":"☆"}</button><div class=name>${m.name}</div><div class=sub>${m.category} / ${m.ceiling}</div><span class=pill>${modeName()}</span><span class=pill>精度${m.confidence}</span>${m.ev?'<span class=pill>公開EVあり</span>':""}</div>`).join(""):`<div class=empty>該当なし</div>`)}
function openM(n){Q.style.display="none";let m=M.find(x=>x.name===n);V.innerHTML=`<button class=back onclick="renderM()">← 機種一覧</button><div class=card><div class=name>${m.name}</div><div class=sub>${modeName()}で判定</div>${fields(m)}<div id=res></div><button class=compare onclick='addC(${JSON.stringify(n)})'>この台を候補比較に追加</button><div class=kv><b>天井</b><span>${m.ceiling}</span></div><div class=kv><b>ヤメ時</b><span>${m.quit}</span></div><p class=note>${m.note}</p><p class=note><a href="${m.source}" target=_blank>解析元を開く</a></p></div>`;document.querySelectorAll("[data-id]").forEach(e=>e.oninput=()=>calc(m));calc(m)}
function calc(m){let x=vals(m),j=judge(m,x),e=adjustedEv(m,x,j);$("#res").innerHTML=`<div class="result ${j.cls}"><div class=grade>${j.label}</div><div class=meta>${j.reason}</div><div class=ev>${e.text}</div><div class=meta>${e.kind} / 精度${e.conf} / ${modeName()}</div></div>`}
function addC(n){let m=M.find(x=>x.name===n),x=vals(m),j=judge(m,x),e=adjustedEv(m,x,j),c=cans();c.push({id:Date.now(),name:n,score:j.score,label:j.label,ev:e.text,kind:e.kind,conf:e.conf});save("candidates",c);alert("候補比較に追加したよ")}
function renderC(){page="c";Q.style.display="none";let c=cans().sort((a,b)=>b.score-a.score);V.innerHTML=`<div class=card><div class=name>候補台ランキング</div><p class=note>判定スコア優先。EVが公開値ベースの台は金額も参考に。</p></div>`+(c.length?c.map((x,i)=>`<div class="card row"><div class=rank>#${i+1}</div><div class=grow><div class=name>${x.name}</div><div class=sub>${x.label} / ${x.ev} / 精度${x.conf}</div></div><button class=del onclick="delC(${x.id})">削除</button></div>`).join(""):`<div class=empty>候補台なし</div>`)}
function delC(id){save("candidates",cans().filter(x=>x.id!==id));renderC()}
function renderS(){page="s";Q.style.display="none";let md=mode();V.innerHTML=`<div class=card><div class=name>交換条件</div><div class=modebox><button class="${md==="equal"?"sel":""}" onclick="sm('equal')">等価</button><button class="${md==="held"?"sel":""}" onclick="sm('held')">非等価<br>持ちメダル</button><button class="${md==="cash"?"sel":""}" onclick="sm('cash')">非等価<br>現金</button></div><p class=note>非等価のEVは公開等価値を保守的に補正した参考値。実際の交換率・投資枚数・再プレイ条件で変わる。</p></div><div class=card><div class=name>期待値表示の意味</div><div class=kv><b>精度A</b><span>公開EV表を直接参照</span></div><div class=kv><b>精度B</b><span>公開値＋条件補正</span></div><div class=kv><b>精度C</b><span>狙い目から推定レンジ</span></div><p class="note warn">推定EVは利益保証ではなく、台の条件比較用の目安。モード・示唆・有利区間・設定差などで変動する。</p></div><div class=card><div class=kv><b>収録</b><span>${M.length}機種</span></div><div class=kv><b>Ver.</b><span>3.0 EV対応</span></div></div>`}
function sm(m){localStorage.setItem("mode3",m);renderS()}
function nav(id){document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("on"));$("#"+id).classList.add("on")}
$("#nm").onclick=()=>{nav("nm");renderM()};$("#nc").onclick=()=>{nav("nc");renderC()};$("#ns").onclick=()=>{nav("ns");renderS()};Q.oninput=()=>page==="m"&&renderM();renderM();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
